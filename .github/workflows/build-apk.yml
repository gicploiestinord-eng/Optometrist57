name: Build APK
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Reface structura proiectului
        run: |
          set -e
          P=app/src/main
          mkdir -p $P/java/ro/optometrist57/app/data $P/java/ro/optometrist57/app/print $P/res/xml $P/res/values
          mv AndroidManifest.xml $P/AndroidManifest.xml
          mv MainActivity.kt $P/java/ro/optometrist57/app/MainActivity.kt
          mv AppDatabase.kt Entities.kt $P/java/ro/optometrist57/app/data/
          mv ReceiptRenderer.kt $P/java/ro/optometrist57/app/print/
          mv file_paths.xml $P/res/xml/
          mv styles.xml $P/res/values/
          cat > build.gradle.kts <<'EOF'
          plugins {
              id("com.android.application") version "8.13.0" apply false
              id("org.jetbrains.kotlin.android") version "2.2.20" apply false
              id("org.jetbrains.kotlin.plugin.compose") version "2.2.20" apply false
              id("com.google.devtools.ksp") version "2.2.20-2.0.3" apply false
          }
          EOF
          cat > app/build.gradle.kts <<'EOF'
          plugins {
              id("com.android.application")
              id("org.jetbrains.kotlin.android")
              id("org.jetbrains.kotlin.plugin.compose")
              id("com.google.devtools.ksp")
          }
          android {
              namespace = "ro.optometrist57.app"
              compileSdk = 36
              defaultConfig {
                  applicationId = "ro.optometrist57.app"
                  minSdk = 26
                  targetSdk = 35
                  versionCode = 1
                  versionName = "0.1.0"
              }
              buildFeatures { compose = true }
          }
          dependencies {
              val composeBom = platform("androidx.compose:compose-bom:2025.10.00")
              implementation(composeBom)
              androidTestImplementation(composeBom)
              implementation("androidx.activity:activity-compose:1.11.0")
              implementation("androidx.core:core-ktx:1.17.0")
              implementation("androidx.compose.ui:ui")
              implementation("androidx.compose.ui:ui-tooling-preview")
              implementation("androidx.compose.material3:material3")
              implementation("androidx.compose.material:material-icons-extended")
              implementation("androidx.lifecycle:lifecycle-runtime-ktx:2.9.4")
              implementation("androidx.lifecycle:lifecycle-viewmodel-compose:2.9.4")
              implementation("androidx.room:room-runtime:2.8.3")
              implementation("androidx.room:room-ktx:2.8.3")
              ksp("androidx.room:room-compiler:2.8.3")
              debugImplementation("androidx.compose.ui:ui-tooling")
          }
          EOF
          find . -path ./.git -prune -o -type f -print | sort

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.14.3
      - run: gradle assembleDebug --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: OPTOMETRIST57-debug-apk
          path: app/build/outputs/apk/debug/*.apk
